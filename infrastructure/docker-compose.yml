services:
  # 1. PostGIS Database Service
  db:
    image: postgis/postgis:15-3.3
    container_name: jaldrishti_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jaldrishti_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jaldrishti_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis Cache & Task Broker
  redis:
    image: redis:7-alpine
    container_name: jaldrishti_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 3. FastAPI Geospatial Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jaldrishti_backend
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/jaldrishti_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # 4. Next.js Frontend Dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: jaldrishti_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
  redis_data:
  backend_uploads:
